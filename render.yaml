services:
  # Node.js server -- Render installs Wasp and builds from source
  - type: web
    name: ecopulse-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: >-
      npm install -g @wasp.sh/wasp-cli@0.25 &&
      export PATH="$(npm prefix -g)/bin:$PATH" &&
      wasp install &&
      wasp build &&
      cd .wasp/out/server &&
      npm install &&
      npx prisma generate --schema=../db/schema.prisma &&
      npm run bundle
    startCommand: cd .wasp/out/server && npm run start-production
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecopulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WASP_SERVER_URL
        sync: false # you'll fill this in after the first deploy
      - key: WASP_WEB_CLIENT_URL
        sync: false # you'll fill this in after the first deploy
      - key: NODE_VERSION
        value: "24"